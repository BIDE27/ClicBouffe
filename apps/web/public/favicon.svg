<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fond officiel ClicBouffe Cyan avec coins arrondis -->
  <rect width="100" height="100" rx="22" fill="#00AFF2" />

  <!-- Groupe Marmite Blanche avec poignées et couvercle -->
  <g fill="#FFFFFF">
    <!-- Poignée gauche -->
    <path d="M 22 45 C 13 45, 11 65, 23 71 C 21 68, 17 64, 17 58 C 17 51, 21 47, 22 45 Z" />
    <!-- Poignée droite -->
    <path d="M 78 45 C 87 45, 89 65, 77 71 C 79 68, 83 64, 83 58 C 83 51, 79 47, 78 45 Z" />

    <!-- Corps de la marmite et couvercle unifiés -->
    <path d="
      M 42 23
      L 43 14
      L 47 18
      L 50 12
      L 53 18
      L 57 14
      L 58 23
      C 67 25, 76 30, 83 37
      L 84 39
      C 84 40, 82 41, 80 41
      L 77 74
      C 76 79, 72 83, 66 83
      L 34 83
      C 28 83, 24 79, 23 74
      L 20 41
      C 18 41, 16 40, 16 39
      L 17 37
      C 24 30, 33 25, 42 23
      Z
    " />
  </g>

  <!-- Curseur de clic Bleu Cyan avec rayons à l'intérieur de la marmite -->
  <g fill="#00AFF2" stroke="#00AFF2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rayons d'impact du clic -->
    <line x1="42" y1="42" x2="38" y2="38" stroke-width="2.5" />
    <line x1="46" y1="40" x2="46" y2="34" stroke-width="2.5" />
    <line x1="51" y1="42" x2="55" y2="38" stroke-width="2.5" />
    <line x1="39" y1="46" x2="34" y2="46" stroke-width="2.5" />
    <line x1="40" y1="52" x2="36" y2="56" stroke-width="2.5" />

    <!-- Flèche du curseur -->
    <path
      d="
        M 45 44
        L 59 58
        L 52.5 58
        L 57.5 67
        L 53.5 69
        L 48.5 60
        L 42 63.5
        Z
      "
      stroke-width="1.5"
    />
  </g>
</svg>
